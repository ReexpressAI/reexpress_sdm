[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reexpress_sdm"
version = "0.4.5"
description = "Portable Similarity-Distance-Magnitude estimation with PyTorch training and inference"
readme = "README.md"
authors = [{name = "Reexpress, AI, Inc.", email = "ai.science@re.express"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "torch>=2.5"]

[project.urls]
Homepage = "https://re.express"

[project.scripts]
sdm = "reexpress_sdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
